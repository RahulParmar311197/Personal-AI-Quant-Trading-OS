name: Backend CI

on:
  push:
    branches: [main, framework/bootstrap]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run backend tests
        run: python -m pytest 24_TESTING/unit 24_TESTING/database -q

      - name: Lint
        run: python -m ruff check 20_API 24_TESTING
