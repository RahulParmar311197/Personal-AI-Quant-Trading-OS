services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: quant_trading_os
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quant_trading_os"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: 27_DEVOPS/docker/backend.Dockerfile
    environment:
      ENVIRONMENT: development
      LIVE_TRADING_ENABLED: "false"
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/quant_trading_os
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: 27_DEVOPS/docker/frontend.Dockerfile
    environment:
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
